<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>DOSBox</title>
<link rel="stylesheet" href="/player.css">
<script defer src="/engine/emulators.js"></script><script defer src="/player.js"></script>
</head><body>
<div id="picture"><canvas id="screen" width="640" height="400" tabindex="0" aria-label="DOSBox display"></canvas></div>
<div id="controls">
<div id="keys" aria-label="Touch controls">
<div id="direction-pad" role="group" aria-label="Directional pad">
  <button data-key="265" class="up" aria-label="Up">▲</button>
  <button data-key="263" class="left" aria-label="Left">◀</button>
  <button data-key="264" class="down" aria-label="Down">▼</button>
  <button data-key="262" class="right" aria-label="Right">▶</button>
</div>
<div id="extra-keys">
<button data-key="341" aria-label="Control">Ctrl</button><button data-key="342">Alt</button><button data-key="32">Space</button>
<button data-key="257">Enter</button><button data-key="256">Esc</button>
<button data-key="290">F1</button><button data-key="294">F5</button>
<button id="right-click" type="button" aria-pressed="false">Right Click</button>
</div>
</div>
<form id="type"><input id="command" aria-label="DOS command or text" placeholder="Type a DOS command…" maxlength="110" autocomplete="off" spellcheck="false"><button>Send</button></form>
<div id="tools"><button id="pause" type="button">Pause</button><button id="audio" type="button" aria-pressed="false" aria-label="Turn game audio on">Enable Sound</button><button id="test-audio" type="button">Test Speaker</button>
<button id="save" type="button">Save Game Files</button><span id="status" role="status">Starting DOSBox…</span></div>
</div>
</body></html>
