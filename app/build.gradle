plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retrodesktop.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.retrodesktop.launcher.resizable'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '2.8-lua-rc1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }
}

dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation 'com.sun.mail:android-activation:1.6.8'
    implementation 'org.luaj:luaj-jme:3.0.1'
}
