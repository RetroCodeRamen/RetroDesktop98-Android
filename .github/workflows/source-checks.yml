name: Source checks
on:
  push:
  pull_request:
jobs:
  dosbox-input-and-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/dosbox-audio.test.js
      - run: python3 -m py_compile tests/check_apk_package.py
